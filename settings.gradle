pluginManagement {
    repositories {
        //mavenLocal()
        //maven { url = '...' }
        gradlePluginPortal()
    }
}

buildCache {
    local {
        directory = new File(rootDir, 'build-cache')
    }
}

rootProject.name = 'ReactiveCA'

include ':app-service'
include ':model'
include ':usecase'
project(':app-service').projectDir = file('./applications/app-service')
project(':model').projectDir = file('./domain/model')
project(':usecase').projectDir = file('./domain/usecase')
include ':r2dbc-postgresql'
project(':r2dbc-postgresql').projectDir = file('./infrastructure/driven-adapters/r2dbc-postgresql')
include ':reactive-web'
project(':reactive-web').projectDir = file('./infrastructure/entry-points/reactive-web')
include ':dto-validator'
project(':dto-validator').projectDir = file('./infrastructure/helpers/dto-validator')
include ':request-validator'
project(':request-validator').projectDir = file('./infrastructure/helpers/request-validator')
include ':validator'
project(':validator').projectDir = file('./infrastructure/helpers/validator')
include ':exceptions'
project(':exceptions').projectDir = file('./infrastructure/helpers/exceptions')
include ':prueba-helper'
project(':prueba-helper').projectDir = file('./infrastructure/helpers/prueba-helper')