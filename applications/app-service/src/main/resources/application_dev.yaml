server:
  port: 8080
spring:
  application:
    name: "ReactiveCA"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
routes:
  paths:
    users:
      users:  "/api/v1/usuarios"
      findByEmail: "/api/v1/usuarios/{email}"
      existsByDocumentAndEmail: "/api/v1/usuarios/exists"
    auth:
      login: "/api/v1/login"
      isSameEmailAsToken: "/api/v1/auth/same-email"
      roleByAuthHeaderToken: "/api/v1/auth/role"
adapters:
  r2dbc:
    host: "localhost"
    port: 5434
    database: "autenticacion"
    schema: "public"
    username: "postgres"
    password: "1234"
jwt:
  secret: uFI2TjnGi3wC9pzQ3urYEyreDGDiYtYoBNelOQRclVzcmJTRDPOSUyY3HrLQGhw5
  expirationMinutes: 400