server:
  port: 8080
spring:
  application:
    name: "ReactiveCA"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
routes:
  paths:
    users:
      users: "/api/v1/usuarios"
      findByEmail: "/api/v1/usuarios/{email}"
      existsByDocumentAndEmail: "/api/v1/usuarios/exists"
    auth:
      login: "/api/v1/login"
      isSameEmailAsToken: "/api/v1/auth/same-email"
      roleByAuthHeaderToken: "/api/v1/auth/role"
adapters:
  r2dbc:
    host: ${AUTH_DB_HOST:postgres17_db_app}
    port: ${AUTH_DB_PORT:5432}
    database: ${AUTH_DB_NAME:autenticacion}
    schema: ${AUTH_DB_SCHEMA:public}
    username: ${AUTH_DB_USER:postgres}
    password: ${AUTH_DB_PASSWORD:1234}
jwt:
  secret: ${JWT_SECRET:uFI2TjnGi3wC9pzQ3urYEyreDGDiYtYoBNelOQRclVzcmJTRDPOSUyY3HrLQGhw5}
  expirationMinutes: ${JWT_EXPIRATION_MINUTES:400}